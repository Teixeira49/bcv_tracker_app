workflows:

  # ─────────────────────────────────────────────
  # WORKFLOW: Android → Firebase App Distribution
  # ─────────────────────────────────────────────
  android-firebase:
    name: Android – Firebase App Distribution
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # Versión FIJA, la misma que `.github/workflows/pr-validation.yml` y que
      # la máquina de desarrollo. `stable` a secas instala la del día, y esa
      # deriva ya rompió la validación de #40 con una aserción de Flutter que
      # la 3.38.3 no trae. Subir de versión es un cambio deliberado: se toca
      # aquí (los tres workflows), en el workflow de GitHub y en local, a la vez.
      flutter: 3.38.3
      groups:
        - firebase_credentials   # FIREBASE_TOKEN o GOOGLE_APPLICATION_CREDENTIALS
        - app_env                # CURRENCY_BACK
      vars:
        PACKAGE_NAME: "com.example.bcv_tracker_app"
        FIREBASE_PROJECT_ID: "bcv-tracker-6a452"
        # FIREBASE_APP_ID_ANDROID viene del grupo firebase_credentials

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    scripts:
      - name: Crear .env
        script: echo "CURRENCY_BACK=$CURRENCY_BACK" > .env

      - name: Instalar dependencias
        script: flutter pub get

      # Antes de compilar, a propósito: si las notas están mal, el build cae en
      # segundos en vez de a los quince minutos. El script no tiene fallback a
      # una cadena genérica — un fallback silencioso es exactamente cómo las
      # notas dejaron de llegar (#93).
      - name: Derivar notas del tester
        script: dart run tool/release_notes_txt.dart

      - name: Analizar código
        script: flutter analyze

      - name: Ejecutar tests
        script: flutter test

      - name: Configurar firma con debug keystore
        script: |
          # Firma con debug keystore para distribución cerrada.
          # Cuando tengas keystore de release, reemplaza esta sección con
          # las variables CM_KEYSTORE, CM_KEY_ALIAS, CM_KEY_PASSWORD, CM_KEYSTORE_PASSWORD
          # y usa el signing config de release en android/app/build.gradle.kts
          echo "Usando debug keystore para distribución cerrada"

      - name: Build APK release
        script: |
          flutter build apk --release \
            --build-name=$(grep "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1) \
            --build-number=${CM_BUILD_NUMBER:-1}

      - name: Distribuir a Firebase App Distribution
        script: |
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID_ANDROID" \
            --groups "testers-pre-produccion" \
            --release-notes-file release_notes.txt

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/app-release.apk.sha1

    publishing:
      email:
        recipients:
          - javiertxr@gmail.com
        notify:
          success: true
          failure: true

    # ── Play Store (comentado – activar cuando tengas cuenta de developer) ──
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal   # internal → alpha → beta → production
    #     submit_as_draft: true


  # ─────────────────────────────────────────────
  # WORKFLOW: iOS → Firebase App Distribution
  # ─────────────────────────────────────────────
  ios-firebase:
    name: iOS – Firebase App Distribution
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      # Versión FIJA, la misma que `.github/workflows/pr-validation.yml` y que
      # la máquina de desarrollo. `stable` a secas instala la del día, y esa
      # deriva ya rompió la validación de #40 con una aserción de Flutter que
      # la 3.38.3 no trae. Subir de versión es un cambio deliberado: se toca
      # aquí (los tres workflows), en el workflow de GitHub y en local, a la vez.
      flutter: 3.38.3
      xcode: latest
      cocoapods: default
      groups:
        - firebase_credentials   # FIREBASE_TOKEN o GOOGLE_APPLICATION_CREDENTIALS
        - app_env                # CURRENCY_BACK
        - ios_signing            # CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD, CM_PROVISIONING_PROFILE
      vars:
        BUNDLE_ID: "com.example.bcvTrackerApp"          # <-- actualizar cuando cambies el bundle ID
        FIREBASE_PROJECT_ID: "bcv-tracker-6a452"
        # FIREBASE_APP_ID_IOS viene del grupo firebase_credentials
        XCODE_PROJECT: "ios/Runner.xcodeproj"
        XCODE_SCHEME: "Runner"

    # Desactivado hasta tener certificados Apple listos
    triggering:
      events: []

    scripts:
      - name: Crear .env
        script: echo "CURRENCY_BACK=$CURRENCY_BACK" > .env

      - name: Instalar dependencias Flutter
        script: flutter pub get

      # Mismo paso, mismo motivo y mismo sitio que en `android-firebase`: las
      # notas se derivan antes de compilar para que un JSON roto no cueste un
      # build entero (#93).
      - name: Derivar notas del tester
        script: dart run tool/release_notes_txt.dart

      - name: Instalar pods
        script: |
          cd ios
          pod install

      - name: Configurar firma de código
        script: |
          # Requiere que el grupo ios_signing tenga:
          #   CM_CERTIFICATE            → certificado P12 en base64
          #   CM_CERTIFICATE_PASSWORD   → contraseña del P12
          #   CM_PROVISIONING_PROFILE   → perfil de aprovisionamiento en base64
          keychain initialize
          @certificate add-provisioning-profiles
          @certificate add-certificates

      - name: Analizar código
        script: flutter analyze

      - name: Ejecutar tests
        script: flutter test

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=$(grep "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1) \
            --build-number=${CM_BUILD_NUMBER:-1} \
            --export-options-plist=/usr/local/lib/flutter/packages/flutter_tools/templates/app/ios.tmpl/ExportOptions.plist

      - name: Distribuir a Firebase App Distribution
        script: |
          firebase appdistribution:distribute \
            $(find build/ios/ipa -name "*.ipa" | head -1) \
            --app "$FIREBASE_APP_ID_IOS" \
            --groups "testers-pre-produccion" \
            --release-notes-file release_notes.txt

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - javiertxr@gmail.com
        notify:
          success: true
          failure: true

    # ── TestFlight (comentado – activar cuando tengas Apple Developer account) ──
    # publishing:
    #   app_store_connect:
    #     api_key: $APP_STORE_CONNECT_PRIVATE_KEY
    #     key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
    #     issuer_id: $APP_STORE_CONNECT_ISSUER_ID
    #     submit_to_testflight: true
    #     submit_to_app_store: false   # true para release a producción


  # ─────────────────────────────────────────────
  # WORKFLOW: Android + iOS simultáneo
  # ─────────────────────────────────────────────
  all-platforms-firebase:
    name: Android + iOS – Firebase App Distribution
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      # Versión FIJA, la misma que `.github/workflows/pr-validation.yml` y que
      # la máquina de desarrollo. `stable` a secas instala la del día, y esa
      # deriva ya rompió la validación de #40 con una aserción de Flutter que
      # la 3.38.3 no trae. Subir de versión es un cambio deliberado: se toca
      # aquí (los tres workflows), en el workflow de GitHub y en local, a la vez.
      flutter: 3.38.3
      xcode: latest
      cocoapods: default
      groups:
        - firebase_credentials
        - app_env
        - ios_signing
      vars:
        PACKAGE_NAME: "com.example.bcv_tracker_app"
        BUNDLE_ID: "com.example.bcvTrackerApp"
        FIREBASE_PROJECT_ID: "bcv-tracker-6a452"
        # FIREBASE_APP_ID_ANDROID y FIREBASE_APP_ID_IOS vienen del grupo firebase_credentials

    # Desactivado hasta tener iOS listo
    triggering:
      events: []

    scripts:
      - name: Crear .env
        script: echo "CURRENCY_BACK=$CURRENCY_BACK" > .env

      - name: Instalar dependencias Flutter
        script: flutter pub get

      # Un solo paso para las dos distribuciones: Android e iOS leen el mismo
      # `release_notes.txt`, así que el tester ve exactamente el mismo texto en
      # las dos plataformas (#93).
      - name: Derivar notas del tester
        script: dart run tool/release_notes_txt.dart

      - name: Instalar pods
        script: |
          cd ios
          pod install

      - name: Configurar firma iOS
        script: |
          keychain initialize
          @certificate add-provisioning-profiles
          @certificate add-certificates

      - name: Analizar código
        script: flutter analyze

      - name: Ejecutar tests
        script: flutter test

      - name: Build APK
        script: |
          flutter build apk --release \
            --build-name=$(grep "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1) \
            --build-number=${CM_BUILD_NUMBER:-1}

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=$(grep "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1) \
            --build-number=${CM_BUILD_NUMBER:-1}

      - name: Distribuir Android a Firebase
        script: |
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID_ANDROID" \
            --groups "testers-pre-produccion" \
            --release-notes-file release_notes.txt

      - name: Distribuir iOS a Firebase
        script: |
          firebase appdistribution:distribute \
            $(find build/ios/ipa -name "*.ipa" | head -1) \
            --app "$FIREBASE_APP_ID_IOS" \
            --groups "testers-pre-produccion" \
            --release-notes-file release_notes.txt

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      # El .sha1 lo emite `flutter build apk` junto al binario y `android-firebase`
      # ya lo adjuntaba; aquí faltaba. Es la huella con la que un tester puede
      # comprobar que el APK que descargó es el que produjo este build.
      - build/app/outputs/flutter-apk/app-release.apk.sha1
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - javiertxr@gmail.com
        notify:
          success: true
          failure: true

    # ── Tiendas (comentado – activar cuando estés listo para producción) ──
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: internal
    #     submit_as_draft: true
    #   app_store_connect:
    #     api_key: $APP_STORE_CONNECT_PRIVATE_KEY
    #     key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
    #     issuer_id: $APP_STORE_CONNECT_ISSUER_ID
    #     submit_to_testflight: true
    #     submit_to_app_store: false
