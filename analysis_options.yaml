# Configuración del analizador estático del proyecto.
#
# Parte de `flutter_lints` (el conjunto recomendado para apps Flutter) y lo
# endurece con las opciones estrictas del lenguaje y un conjunto de reglas
# propias. La razón: el análisis es la primera red que atrapa un error antes
# de que corran los tests, y en una app que mapea JSON de un backend frágil
# los `dynamic` implícitos son justo donde se cuela un fallo silencioso.
#
# CI ejecuta `flutter analyze` SIN `--no-fatal-warnings`, así que cualquier
# cosa que reporte este archivo rompe el build de la PR. Ver #29 y #27.

include: package:flutter_lints/flutter.yaml

analyzer:
  # Modos estrictos del lenguaje. Cierran los agujeros por donde `dynamic`
  # entra sin que nadie lo pida.
  language:
    # Un `dynamic` no se asigna a un tipo concreto sin un cast explícito. Es el
    # que atrapa los mapeos de JSON: `json['value']` es `dynamic` y ya no se
    # puede pasar como `double` sin decirlo.
    strict-casts: true
    # El analizador no infiere `dynamic` en silencio cuando no puede deducir un
    # tipo: obliga a anotarlo.
    strict-inference: true
    # Un tipo genérico usado sin sus argumentos (`List` en vez de `List<T>`) se
    # reporta en vez de degradar a `List<dynamic>`.
    strict-raw-types: true

linter:
  rules:
    # Prohíbe entrar a las rutas `src/` internas de un paquete: es API privada
    # y puede cambiar en una versión patch. Guardrail de #52.
    implementation_imports: true
    # `print` no va en producción: el logging pasa por `dart:developer log`.
    # Apoya el guardrail de logging de #19.
    avoid_print: true
    # El repo mezcla comillas simples y dobles; unificar en simples deja los
    # diffs limpios y es el default de Dart.
    prefer_single_quotes: true
    # Toda función declara su tipo de retorno: nada de `dynamic` por omisión.
    always_declare_return_types: true
    # Ordena las directivas de import de forma estable, para que dos cambios en
    # el mismo bloque no choquen por el orden.
    directives_ordering: true
