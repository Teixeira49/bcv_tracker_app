# Validación de Pull Requests
#
# Corre el análisis estático y los tests en cada PR, ANTES de fusionar, para no
# descubrir en `master` que algo se rompió (issue #27).
#
# Este pipeline NO construye ni distribuye: eso sigue en `codemagic.yaml`, que
# se dispara con el push a `master`. Aquí solo se valida.
name: PR Validation

# El workflow de trabajo de este repo mergea a `development` y solo promociona
# `development → master` en el release. Validar solo los PR a `master` dejaría
# sin check todo el trabajo diario, así que se cubren ambas ramas destino.
on:
  pull_request:
    branches:
      - master
      - development

# Un push nuevo a la misma PR cancela la validación en curso: no tiene sentido
# gastar minutos en un commit que ya quedó atrás.
concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: flutter analyze + flutter test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Versión FIJA, no `stable` a secas — y la misma que codemagic.yaml,
          # para que lo que valida la PR sea lo mismo que construye el release.
          #
          # `channel: stable` instala la stable *del día*, así que CI iba por
          # delante de las máquinas de desarrollo. Eso pasó factura en #40: diez
          # tests verdes en local fallaron aquí contra una aserción de
          # `ListTile` que la 3.38.3 todavía no trae. El fallo era real y se
          # arregló, pero se descubrió tarde y por el motivo equivocado.
          #
          # Al fijarla, subir de versión pasa a ser un cambio deliberado con su
          # propia PR: se actualiza aquí, en los dos workflows de
          # `codemagic.yaml` y en la máquina de desarrollo, a la vez.
          flutter-version: 3.38.3
          channel: stable
          cache: true

      - name: Crear .env de validación
        # La app solo necesita que la variable exista y tenga forma de URL para
        # arrancar; en validación no se distribuye nada, así que un valor
        # ficticio basta. Nunca un backend real: esto queda en los logs de la PR.
        run: echo "CURRENCY_BACK=https://ci.example.com" > .env

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        # Análisis estricto: sin `--no-fatal-*`, cualquier hallazgo (error,
        # warning o info) rompe la PR. El árbol se dejó en cero hallazgos con la
        # config estricta de `analysis_options.yaml` (#29), y CI la mantiene así.
        run: flutter analyze

      - name: Ejecutar tests
        run: flutter test
